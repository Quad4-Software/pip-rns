[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pip-rns"
dynamic = ["version"]
description = "Install Python packages from Reticulum remotes and offline wheel bundles"
requires-python = ">=3.7"
license = {text = "BSD-2-Clause"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving :: Packaging",
]

[project.scripts]
pip-rns = "pip_rns.cli:main"
pipx-rns = "pip_rns.cli_pipx:main"
opip = "opip.cli:main"

[tool.hatch.version]
path = "src/pip_rns/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pip_rns", "src/opip", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"completions" = "completions"

[dependency-groups]
dev = [
    "hypothesis>=6.79.4",
    "mypy>=1.4.1",
    "ruff>=0.9.0",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
packages = ["pip_rns", "opip", "tests"]

[[tool.mypy.overrides]]
module = "RNS"
ignore_missing_imports = true

[tool.ruff]
target-version = "py37"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = [
    "B904",
    "E501",
    "SIM117",
]

[tool.ruff.format]
quote-style = "double"
