# Publish Docsify site from ./docs to GitHub Pages.
# Custom domain: pip-rns.quad4.io (CNAME in docs/, Pages build_type=workflow).
# Actions pinned to full commit SHAs.

name: Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Verify Docsify entrypoints
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/_sidebar.md
          test -f docs/CNAME
          test -f docs/.nojekyll
          test -f docs/assets/theme.css
          test -f docs/vendor/docsify.min.js
          test -f docs/vendor/dark.css
          grep -qx 'pip-rns.quad4.io' docs/CNAME
          ! grep -E 'cdn\.jsdelivr\.net|fonts\.googleapis\.com' docs/index.html
          ! grep -E 'cdn\.jsdelivr\.net|fonts\.googleapis\.com' docs/assets/theme.css

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
