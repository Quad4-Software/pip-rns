<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>pip-rns docs</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Install Python packages over Reticulum and share integrity-backed offline wheel bundles with opip.">
  <meta name="theme-color" content="#121212">
  <link rel="stylesheet" href="/vendor/dark.css">
  <link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
  <div id="app">Loading docs...</div>
  <script>
    // Migrate old hash routes (/#/page) to history paths (/page).
    (function () {
      var h = window.location.hash || ""
      if (h.indexOf("#/") === 0) {
        var path = h.slice(1)
        if (path === "/") path = "/"
        window.location.replace(path + window.location.search)
      }
    })()
  </script>
  <script>
    window.$docsify = {
      name: "pip-rns",
      nameLink: "/",
      repo: "Quad4-Software/pip-rns",
      routerMode: "history",
      loadSidebar: true,
      autoHeader: false,
      subMaxLevel: 2,
      auto2top: true,
      homepage: "README.md",
      themeColor: "#c4a574",
      alias: {
        "/.*/_sidebar.md": "/_sidebar.md",
      },
      search: {
        placeholder: "Search",
        noData: "No results",
        depth: 3,
        hideOtherSidebarContent: true,
      },
      copyCode: {
        buttonText: "Copy",
        errorText: "Failed",
        successText: "Copied",
      },
      pagination: {
        previousText: "Prev",
        nextText: "Next",
        crossChapter: true,
      },
    }
  </script>
  <script src="/vendor/docsify.min.js"></script>
  <script src="/vendor/search.min.js"></script>
  <script src="/vendor/docsify-copy-code.min.js"></script>
  <script src="/vendor/docsify-pagination.min.js"></script>
  <script src="/vendor/prism-bash.min.js"></script>
  <script src="/vendor/prism-python.min.js"></script>
</body>
</html>
